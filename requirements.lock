# 可复现构建用的精确版本快照。
#
# requirements.txt 是可读的宽松约束（「>= 某个版本」），这份文件是某台机器上
# 真跑通全部套件的那一组。CI 与发布包都按这份装，避免上游发个新小版本就让
# 打包产物或测试结果变样。
#
# 更新办法：在干净 venv 里按 requirements.txt 装好，跑完全部套件，再按实际
# 装到的版本改这里。
#
# 注意 PySide6 要装全：QtPdf 属于 Addons，PDF 导出与自检都直接 import 它，
# 只装 Essentials 会在 `from PySide6.QtPdf import QPdfDocument` 上抛
# ModuleNotFoundError。这一点在干净 venv 里才暴露得出来——开发机上残留着
# 早先装过的文件，看起来一切正常。

